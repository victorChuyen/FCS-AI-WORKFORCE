name: Prepare Admin SDK lockfile (draft only)
on:
  push:
    branches: [feature/FCS-P1-009-auth-hardening]
    paths: [.github/workflows/prepare-admin-lock.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'victorChuyen/FCS-AI-WORKFORCE' && github.ref == 'refs/heads/feature/FCS-P1-009-auth-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 8ac6d8a6c4daa204e7dc8fc289bcbbbbb72cc5c1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Resolve declared server-only SDK without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact firebase-admin@14.4.0
      - name: Store immutable manifest blobs only (no commit, ref, release or deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          for (const file of ['package.json', 'package-lock.json']) {
            const bytes = fs.readFileSync(file);
            const res = await fetch('https://api.github.com/repos/victorChuyen/FCS-AI-WORKFORCE/git/blobs', {
              method: 'POST', redirect: 'error',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content: bytes.toString('base64'), encoding: 'base64' })
            });
            if (!res.ok) throw new Error(`Blob creation failed: HTTP ${res.status}`);
            const blob = await res.json();
            console.log(JSON.stringify({ file, sha: blob.sha, sha256: crypto.createHash('sha256').update(bytes).digest('hex') }));
          }
          NODE
